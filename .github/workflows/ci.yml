name: CI

on:
  pull_request:
    branches: [master]
    # labeled/unlabeled so toggling `allow-escape-hatch` re-runs the guardrails job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  biome:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      # Full history so the diff checks can find the merge base with the PR base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pushes only run the escape-hatch budget and ceilings; PRs also check added
      # lines for new escape hatches (waived by the `allow-escape-hatch` label) and
      # for comments without `why:`.
      - name: Check guardrails
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOW_HATCHES: ${{ contains(github.event.pull_request.labels.*.name, 'allow-escape-hatch') }}
        run: |
          args=()
          if [ -n "$BASE_REF" ]; then args+=(--base "origin/$BASE_REF"); fi
          if [ "$ALLOW_HATCHES" = "true" ]; then args+=(--allow-escape-hatches); fi
          node scripts/guardrails/check-diff.ts "${args[@]}"

  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Real coverage, so complexity is scored against what the tests exercise
      # rather than Fallow's estimate from export references.
      - run: pnpm run coverage
      - name: Fallow audit against merge base
        run: pnpm exec fallow audit --base ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --coverage coverage/coverage-final.json

  build:
    name: Build
    needs: [typecheck, biome, test, guardrails, fallow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
